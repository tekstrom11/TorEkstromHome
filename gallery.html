<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tor Ekstrom - Gallery</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <header class="gallery-header">
      <div class="gallery-background container-fluid">
        <div class="row">
          <div class="col-12 px-0">
            <img
              class="background-img"
              src="images/fisherGraveyard.jpg"
              alt="grainy picture of a lonely graveyard"
            />
            <div class="gallery-top">
              <h1 class="h1-gallery">Tor Ekstrom/<br>Gallery</h1>
              <nav class="nav-box">
                <ul class="no-bullets" id="main-nav"></ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="container-fluid gallery-container" id="galImages">
      </div>
    </main>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/gallery.js"></script>
  </body>
</html>
